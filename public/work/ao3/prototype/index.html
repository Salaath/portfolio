<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Opening 3.0</title>
<meta name="description" content="Interactive prototype of Upstox Account Opening 3.0 — happy path and manual fallbacks for PAN, bank and personal details.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist+Mono:wght@500&family=VT323&family=Noto+Serif+Devanagari:wght@500&family=Barlow+Condensed:wght@500&family=Plus+Jakarta+Sans:wght@500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <aside class="panel" id="panel">
    <div class="panel-head">
      <div class="eyebrow">Interactive prototype</div>
      <h1>Account Opening 3.0</h1>
      <p class="lede">Sign up to first trade in one guided flow. Use the switches to make an auto-fetch fail and see the manual fallback.</p>
    </div>

    <div class="panel-block">
      <div class="block-title">Scenario</div>
      <label class="switch-row"><span><b>PAN auto-fetch</b><i>Linked PAN found from mobile number</i></span><input type="checkbox" data-scn="panAuto" checked><em></em></label>
      <label class="switch-row"><span><b>Bank auto-fetch</b><i>Primary bank account found from PAN</i></span><input type="checkbox" data-scn="bankAuto" checked><em></em></label>
      <label class="switch-row"><span><b>Address auto-fetch</b><i>KYC address found in records</i></span><input type="checkbox" data-scn="personalAuto" checked><em></em></label>
      <label class="switch-row"><span><b>₹1 bank check fails</b><i>Manual bank entry falls back to uploading proof</i></span><input type="checkbox" data-scn="pennyFail"><em></em></label>
      <div class="presets">
        <button data-preset="happy" class="chip on">Happy path</button>
        <button data-preset="manual">All manual</button>
        <button data-preset="pan">PAN only</button>
        <button data-preset="bank">Bank only</button>
      </div>
    </div>

    <div class="panel-block">
      <div class="block-title">Jump to</div>
      <div class="jumps" id="jumps"></div>
    </div>

    <div class="panel-foot">
      <button class="restart" id="restart"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
      <span class="hint">Tip: you can type on your keyboard too</span>
    </div>
  </aside>

  <div class="device-wrap">
    <div class="device" id="device">
      <div class="screen" id="screen">
        <div class="statusbar" id="statusbar">
          <span class="sb-time">9:41</span>
          <span class="island"></span>
          <span class="sb-icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 8 1 9.6 9.6 0 0 0 1.2 3.8l1.1 1.1A8 8 0 0 1 8 2.6Zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1A6.4 6.4 0 0 0 8 4.2c-1.7 0-3.3.7-4.5 1.8l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3Zm0 3.2c-.5 0-1 .2-1.3.5L8 11l1.3-1.5c-.3-.3-.8-.5-1.3-.5Z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.4"/><path d="M24 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".45"/></svg>
          </span>
        </div>
        <div class="views" id="views"></div>
        <div class="sheet-layer" id="sheetLayer"></div>
        <div class="kb-layer" id="kbLayer"></div>
        <div class="toast" id="toast"></div>
        <div class="home-ind"></div>
      </div>
    </div>
  </div>
</div>
<script src="assets/lottie.min.js"></script>
<script src="assets/folder-anim.js"></script>
<script src="assets/clock-anim.js"></script>
<script src="assets/tick-anim.js"></script>
<script src="assets/graph-anim.js"></script>
<script src="keyboard.js"></script>
<script src="app.js"></script>
</body>
</html>
